name: Build Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-amd64-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mi-xiaoai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: docker save mi-xiaoai:latest --output mi-xiaoai-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi-xiaoai-image
          path: mi-xiaoai-image.tar
          if-no-files-found: error
          retention-days: 7
